version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trypt-hifi
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - trypt-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: trypt-cloudflared
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - trypt-network
    # No ports exposed - all traffic goes through the tunnel

networks:
  trypt-network:
    driver: bridge